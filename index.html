<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPOTPLAN · 스팟스튜디오</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cg fill='%234A4A4A'%3E%3Ccircle cx='2' cy='2' r='1.4'/%3E%3Ccircle cx='6' cy='2' r='1.4'/%3E%3Ccircle cx='10' cy='2' r='1.4'/%3E%3Ccircle cx='14' cy='2' r='1.4'/%3E%3Ccircle cx='2' cy='6' r='1.4'/%3E%3Ccircle cx='6' cy='6' r='1.4'/%3E%3Ccircle cx='10' cy='6' r='1.4'/%3E%3Ccircle cx='14' cy='6' r='1.4'/%3E%3Ccircle cx='2' cy='10' r='1.4'/%3E%3Ccircle cx='6' cy='10' r='1.4'/%3E%3Ccircle cx='10' cy='10' r='1.4'/%3E%3Ccircle cx='14' cy='10' r='1.4'/%3E%3Ccircle cx='2' cy='14' r='1.4'/%3E%3Ccircle cx='6' cy='14' r='1.4'/%3E%3Ccircle cx='10' cy='14' r='1.4'/%3E%3Ccircle cx='14' cy='14' r='1.4'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#FFFFFF; --panel:#F2F2F2; --line:#E2E2E2; --dot:#A6A6A6; --muted:#767676;
  --text:#4A4A4A; --strong:#1A1A1A; --accent:#C8553D; --accent-bg:#FBEFEC;
  --card:#FFFFFF; --ok:#2F6B4F; --ok-bg:#EAF3EE; --shadow:0 1px 3px rgba(0,0,0,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141414; --panel:#1F1F1F; --line:#2E2E2E; --dot:#5A5A5A; --muted:#9A9A9A;
    --text:#CFCFCF; --strong:#F2F2F2; --accent:#E07A63; --accent-bg:#3A221D;
    --card:#1A1A1A; --ok:#7FC4A0; --ok-bg:#1C2B23; --shadow:none; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141414; --panel:#1F1F1F; --line:#2E2E2E; --dot:#5A5A5A; --muted:#9A9A9A;
  --text:#CFCFCF; --strong:#F2F2F2; --accent:#E07A63; --accent-bg:#3A221D;
  --card:#1A1A1A; --ok:#7FC4A0; --ok-bg:#1C2B23; --shadow:none; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all}
a{color:var(--strong)}
h1,h2,h3{color:var(--strong);margin:0;font-weight:600}
button,input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.narrow{max-width:640px}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:13px}
.accent{color:var(--accent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1}
.stack>*+*{margin-top:12px}

/* 헤더 */
.top{border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:20}
.top .wrap{display:flex;align-items:center;gap:14px;height:58px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--strong)}
.brand b{letter-spacing:.28em;font-weight:500;font-size:14px}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.02em}
.nav{display:flex;gap:4px;margin-left:12px}
.nav a{padding:6px 10px;border-radius:8px;text-decoration:none;color:var(--muted);font-size:14px}
.nav a.on{color:var(--strong);background:var(--panel)}
.spacer{flex:1}
.demo-badge{font-size:12px;padding:3px 8px;border-radius:99px;background:var(--accent-bg);color:var(--accent)}

/* 섹션 제목: 가는 굵기 + 넓은 자간 */
.sec-title{font-weight:300;letter-spacing:.35em;font-size:13px;color:var(--muted);margin:0 0 10px}
.page-title{font-size:24px;font-weight:600;letter-spacing:-.01em}

/* 카드/패널 */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.panel{background:var(--panel);border-radius:12px;padding:14px}
.divider{height:1px;background:var(--line);margin:18px 0}

/* 폼 */
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.req::after{content:" *";color:var(--accent)}
input[type=text],input[type=email],input[type=tel],input[type=url],input[type=password],input[type=number],input[type=search],textarea,select{
  width:100%;border:1px solid transparent;background:var(--panel);border-radius:10px;padding:10px 12px;outline:none;min-height:42px}
input:focus,textarea:focus,select:focus{border-color:var(--dot);background:var(--bg)}
textarea{resize:vertical;min-height:84px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--bg);color:var(--strong);
  border-radius:10px;padding:8px 14px;cursor:pointer;min-height:38px;font-size:14px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--dot)}
.btn.primary{background:var(--strong);color:var(--bg);border-color:var(--strong)}
.btn.primary:hover{opacity:.88}
.btn.danger{color:var(--accent);border-color:var(--accent)}
.btn.warn-armed{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--strong);background:var(--panel)}
.btn.sm{min-height:30px;padding:4px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{min-height:50px;padding:12px 20px;font-size:16px;border-radius:12px;width:100%}

/* 칩/배지 */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--panel);color:var(--text);white-space:nowrap}
.chip.dark{background:var(--strong);color:var(--bg)}
.chip.warn{background:var(--accent-bg);color:var(--accent)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.line{background:transparent;border:1px solid var(--line)}

/* 진행 점 */
.dots{display:flex;align-items:center;gap:0;flex-wrap:wrap}
.dots .st{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.dots .d{width:10px;height:10px;border-radius:50%;background:var(--dot);opacity:.45}
.dots .st.done .d{background:var(--strong);opacity:1}
.dots .st.done{color:var(--strong)}
.dots .st.cur .d{background:var(--text);opacity:1;box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--strong)}
.dots .st.cur{color:var(--strong);font-weight:600}
.dots .bar{width:22px;height:1px;background:var(--line);margin:0 8px}

/* 목적 선택 버튼 */
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:640px){.choices{grid-template-columns:1fr 1fr}}
.choice{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--bg);cursor:pointer;text-align:left;min-height:78px}
.choice b{display:block;color:var(--strong);font-weight:600}
.choice small{color:var(--muted);font-size:12.5px;line-height:1.45;display:block;margin-top:2px}
.choice.on{border-color:var(--strong);box-shadow:inset 0 0 0 1px var(--strong)}
details.more{border:1px dashed var(--dot);border-radius:12px;padding:12px 14px}
details.more summary{cursor:pointer;color:var(--strong);font-weight:500;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+ ";color:var(--muted)}
details.more[open] summary::before{content:"− "}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:var(--panel);cursor:pointer;font-size:14px}
.radios input{accent-color:var(--strong)}
.consent{font-size:13px;color:var(--muted);background:var(--panel);border-radius:10px;padding:12px}
.consent label{display:flex;gap:8px;align-items:flex-start;color:var(--strong);font-size:14px;cursor:pointer}
.consent input{margin-top:4px;accent-color:var(--strong);width:16px;height:16px}
.notice{border-left:3px solid var(--strong);background:var(--panel);padding:10px 12px;border-radius:0 10px 10px 0;font-size:14px}
.notice.warn{border-color:var(--accent);background:var(--accent-bg)}
.hp{position:absolute;left:-5000px;width:1px;height:1px;overflow:hidden}

/* 목록 */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:13px;color:var(--muted)}
.filters button.on{background:var(--strong);color:var(--bg);border-color:var(--strong)}
.plist{display:flex;flex-direction:column;gap:8px}
.pitem{display:grid;grid-template-columns:96px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--card);text-decoration:none;color:inherit}
.pitem:hover{border-color:var(--dot)}
.pitem .t{color:var(--strong);font-weight:600}
@media (max-width:640px){.pitem{grid-template-columns:1fr}}

/* 탭 */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0 18px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--strong);border-color:var(--strong);font-weight:600}
.rtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.rtabs button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 12px;cursor:pointer;font-size:14px}
.rtabs button.on{background:var(--strong);color:var(--bg);border-color:var(--strong)}

/* 요청서 편집 */
.two{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:92px 1fr;gap:4px 10px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;color:var(--strong);white-space:pre-wrap;word-break:break-word}
.items-table{width:100%;border-collapse:collapse}
.items-table th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:4px 6px}
.items-table td{padding:4px 6px;vertical-align:top}
.items-table .letter{width:36px;font-weight:700;color:var(--strong);padding-top:14px}
.items-table .cuts{width:80px}
.checks li{margin:4px 0}
.checks{padding-left:18px;margin:6px 0}
.src-tag{font-size:11.5px;color:var(--muted)}
.diff{display:grid;grid-template-columns:24px 110px 1fr 1fr;gap:6px 10px;align-items:start;font-size:14px}
.diff .h{font-size:12px;color:var(--muted)}
.diff .old{color:var(--muted);white-space:pre-wrap}
.diff .new{color:var(--strong);white-space:pre-wrap}
@media (max-width:640px){.diff{grid-template-columns:24px 1fr}.diff .old,.diff .h.o{display:none}.diff .lbl{grid-column:2}.diff .new{grid-column:2}}

/* 샘플 카드 */
.item-block{margin-bottom:26px}
.item-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.item-head h3{font-size:17px}
.item-head .letter{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--strong);color:var(--bg);align-items:center;justify-content:center;font-size:13px;font-weight:700}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
@media (max-width:640px){.sgrid{grid-template-columns:1fr 1fr;gap:8px}}
.scard{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);display:flex;flex-direction:column;position:relative;transition:box-shadow .2s,border-color .2s}
.scard.picked{border-color:var(--strong);box-shadow:0 0 0 2px var(--strong)}
.scard.dim{opacity:.45}
.scard.focus{box-shadow:0 0 0 3px var(--accent)}
.scard .img{aspect-ratio:4/5;background:var(--panel);cursor:zoom-in;position:relative;overflow:hidden}
.scard .img img{width:100%;height:100%;object-fit:cover;display:block}
.scard .lbl{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.66);color:#fff;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px}
.scard .pk{position:absolute;right:8px;top:8px}
.scard .body{padding:10px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.scard .ttl{color:var(--strong);font-weight:600;font-size:14px}
.scard .note{font-size:13px;white-space:pre-wrap}
.scard .cr{font-size:11.5px;color:var(--muted)}
.scard .acts{display:flex;gap:4px;flex-wrap:wrap;padding:0 10px 10px}
.scard .pickbtn{margin:0 10px 10px}
.scard textarea{min-height:56px;font-size:13px;margin:0 10px 10px;width:calc(100% - 20px)}
.ai-tag{font-size:11px;background:var(--accent-bg);color:var(--accent);padding:1px 6px;border-radius:6px}
.addbar{display:flex;gap:6px;flex-wrap:wrap}
.mult{font-size:13px}

/* 모달 */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal{background:var(--bg);border-radius:16px;width:100%;max-width:760px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal.wide{max-width:1000px}
.modal h2{font-size:18px;margin-bottom:12px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.pres{border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;position:relative;background:var(--panel)}
.pres img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.pres .cap{font-size:11px;padding:4px 6px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pres.added::after{content:"추가됨";position:absolute;inset:0;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600}

/* 라이트박스 */
.lb{position:fixed;inset:0;background:rgba(10,10,10,.94);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.lb img{max-width:100%;max-height:calc(100vh - 120px);object-fit:contain}
.lb .cap{color:#ddd;font-size:13px;margin-top:10px;text-align:center;max-width:720px}
.lb .x{position:absolute;right:14px;top:10px;background:none;border:0;color:#fff;font-size:30px;cursor:pointer}
.lb .nav-l,.lb .nav-r{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.12);border:0;color:#fff;font-size:26px;width:46px;height:46px;border-radius:50%;cursor:pointer}
.lb .nav-l{left:12px}.lb .nav-r{right:12px}

/* 고객 화면 */
.cust-hero{padding:28px 0 14px}
.banner{position:sticky;top:58px;z-index:15;background:var(--strong);color:var(--bg);padding:10px 16px;font-size:14px;display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap}
.banner .pulse{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
.typing{font-size:12px;opacity:.8}
.sticky-submit{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 0;margin-top:20px;z-index:10}
.shotlist{width:100%;border-collapse:collapse;font-size:14px}
.shotlist th,.shotlist td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
.shotlist th{font-size:12px;color:var(--muted);font-weight:500}
.shotlist img{width:56px;height:70px;object-fit:cover;border-radius:6px;display:block}

.log{font-size:14px}
.log li{padding:8px 0;border-bottom:1px solid var(--line);list-style:none;display:grid;grid-template-columns:140px 110px 1fr;gap:10px}
.log{padding:0;margin:0}
@media (max-width:640px){.log li{grid-template-columns:1fr}}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--strong);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:300;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--dot);border-top-color:var(--strong);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
/* 첨부 파일 */
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1px dashed var(--dot);border-radius:12px;padding:14px;cursor:pointer;text-align:center;color:var(--strong)}
.drop small{color:var(--muted);font-size:12.5px}
.drop.over{background:var(--panel);border-color:var(--strong)}
.flist{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
.flist li{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:10px;padding:6px 10px;font-size:14px}
.flist .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--strong)}
.flist img,.flist .ficon{width:36px;height:36px;border-radius:6px;object-fit:cover;flex:none;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--muted)}
.flist img{cursor:zoom-in}
footer.foot{padding:30px 0 40px;color:var(--muted);font-size:12px;text-align:center}
</style>
</head>
<body>
<div id="app"><div class="empty"><span class="spin"></span></div></div>

<script>
/* =====================================================================
   공통 도구
   ===================================================================== */
const CFG = window.SPOTPLAN_CONFIG;
const SB_KEY = CFG.SUPABASE_KEY || CFG.SUPABASE_ANON_KEY || '';
const DEMO = !CFG.SUPABASE_URL || !SB_KEY;
const BRAND = CFG.BRAND_NAME || 'SpotStudio';
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nowIso = () => new Date().toISOString();
const rid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
const fmtSize = n => n >= 1048576 ? (n / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(n / 1024)) + 'KB';
const extOf = name => { const m = String(name || '').match(/\.([A-Za-z0-9]{1,8})$/); return m ? m[1].toLowerCase() : 'bin'; };
const isImageAtt = a => /^image\//.test(a.type || '') || /\.(jpe?g|png|gif|webp|heic|heif)$/i.test(a.name || '');
/* 새 창에서 파일 열기 (팝업 차단을 피하려고 창을 먼저 연 뒤 주소를 넣음) */
async function openFile(getUrl, name) {
  const w = window.open('', '_blank');
  try {
    const url = await getUrl();
    if (url.startsWith('data:')) { if (w) w.close(); const a = document.createElement('a'); a.href = url; a.download = name || 'file'; document.body.appendChild(a); a.click(); a.remove(); return; }
    if (w) w.location = url; else location.href = url;
  } catch (e) { if (w) w.close(); fail(e); }
}
const fmt = (iso, withTime = true) => {
  if (!iso) return '';
  const d = new Date(iso);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())}` + (withTime ? ` ${p(d.getHours())}:${p(d.getMinutes())}` : '');
};
const ago = (iso) => {
  if (!iso) return '';
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 60) return '방금';
  if (s < 3600) return Math.floor(s / 60) + '분 전';
  if (s < 86400) return Math.floor(s / 3600) + '시간 전';
  return fmt(iso, false);
};
function debounce(fn, ms) { let t; const d = (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; d.flush = (...a) => { clearTimeout(t); return fn(...a); }; return d; }
function toast(msg, ms = 2600) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), ms);
}
function fail(e) { console.error(e); toast('오류: ' + (e && e.message ? e.message : e), 4200); }
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch {} ta.remove(); }
  toast('복사했습니다');
}
/* 두 번 눌러야 실행되는 삭제 버튼 */
function twoClick(btn, action, armedText = '한 번 더 누르면 삭제') {
  if (btn.dataset.armed === '1') { btn.dataset.armed = ''; btn.disabled = true; Promise.resolve(action()).catch(fail).finally(() => { btn.disabled = false; }); return; }
  const orig = btn.textContent; btn.dataset.armed = '1'; btn.textContent = armedText; btn.classList.add('warn-armed');
  setTimeout(() => { if (btn.isConnected && btn.dataset.armed === '1') { btn.dataset.armed = ''; btn.textContent = orig; btn.classList.remove('warn-armed'); } }, 3500);
}
function logoSvg(size = 22) {
  let c = '';
  for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) c += `<circle cx="${2 + x * 4}" cy="${2 + y * 4}" r="1.35" fill="${(x + y) % 3 === 0 ? 'var(--strong)' : 'var(--dot)'}"/>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 16 16" aria-hidden="true">${c}</svg>`;
}
/* 사진 축소: 긴 변 1600px JPEG */
function resizeImage(file, max = 1600) {
  return new Promise((resolve, reject) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? resolve(b) : reject(new Error('이미지 변환 실패')), 'image/jpeg', 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('이미지를 읽을 수 없습니다')); };
    img.src = url;
  });
}
function blobToDataUrl(blob) { return new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); }); }

function makeSupabaseDB() {

  async function removeFiles(rows) {
    let paths = [...new Set((rows || []).map(r => r.storage_path).filter(Boolean))];
    if (!paths.length) return;
    const still = chk(await T('samples').select('storage_path').in('storage_path', paths));
    const keep = new Set(still.map(x => x.storage_path));
    paths = paths.filter(x => !keep.has(x));

      const { error } = await sb.storage.from('samples').remove(paths.slice(i, i + 100));
      if (error) console.warn('사진 파일 삭제 실패', error);
    }

    /* 고객 첨부: 비공개 버킷에 올리기만 가능. 한글 파일명은 저장 경로에 못 쓰므로 번호로 저장하고 원래 이름은 따로 기록 */

    channel(name, onMsg) {

    },

      const ch = sb.channel('sp-projects-' + rid()).on('postgres_changes', { event: '*', schema: 'public', table: 'projects' }, () => cb()).subscribe();

    async getProject(id) { const p = db().projects.find(x => x.id === id); if (!p) throw new Error('프로젝트를 찾을 수 없습니다'); return clone(p); },
    async createProject(o) { const d = db(); const p = { id: rid(), token: 'demo' + rid().replace(/-/g, ''), created_at: nowIso(), updated_at: nowIso(), status: 'requested', is_test: false,

    async updateProject(id, patch) { const d = db(); const p = d.projects.find(x => x.id === id); Object.assign(p, clone(patch)); p.updated_at = nowIso(); save(); return clone(p); },
    async regenToken(id) { return this.updateProject(id, { token: 'demo' + rid().replace(/-/g, '') }); },
    async deleteProjects(ids) { const d = db(); d.projects = d.projects.filter(p => !ids.includes(p.id)); d.rounds = d.rounds.filter(r => !ids.includes(r.project_id));
      d.samples = d.samples.filter(s => !ids.includes(s.project_id)); d.logs = d.logs.filter(l => !ids.includes(l.project_id)); save(); },

    async listRounds(pid) { return clone(db().rounds.filter(r => r.project_id === pid).sort((a, b) => a.n - b.n)); },
    async createRound(o) { const d = db(); if (d.rounds.some(r => r.project_id === o.project_id && r.n === o.n)) throw new Error('같은 차수가 이미 있습니다');
      const r = { id: rid(), status: 'draft', rev: 1, studio_note: '', customer_note: '', intent: '', counters: {}, edits: [], created_at: nowIso(), sent_at: null, picked_at: null, ...clone(o) };
      d.rounds.push(r); touch(d, o.project_id); save(); return clone(r); },
    async updateRound(id, p) { const d = db(); const r = d.rounds.find(x => x.id === id); Object.assign(r, clone(p)); touch(d, r.project_id); save(); return clone(r); },
    async deleteRound(id) { const d = db(); const r = d.rounds.find(x => x.id === id); d.rounds = d.rounds.filter(x => x.id !== id); d.samples = d.samples.filter(s => s.round_id !== id); if (r) touch(d, r.project_id); save(); },

    async listSamples(pid) { return clone(db().samples.filter(s => s.project_id === pid).sort((a, b) => a.sort - b.sort || a.created_at.localeCompare(b.created_at))); },
    async addSamples(arr) { const d = db(); const out = arr.map(o => ({ id: rid(), sort: 0, kind: 'photo', image_url: '', storage_path: null, title: '', note: '', source: '', source_url: '', credit: '', from_label: '',
      state: null, picked: false, pick_comment: '', picked_by: '', picked_at: null, created_at: nowIso(), ...clone(o) })); d.samples.push(...out); if (out[0]) touch(d, out[0].project_id); save(); return clone(out); },
    async updateSample(id, p) { const d = db(); const s = d.samples.find(x => x.id === id); Object.assign(s, clone(p)); touch(d, s.project_id); save(); return clone(s); },
    async deleteSamples(rows) { const d = db(); const ids = rows.map(r => r.id); const s0 = d.samples.find(s => ids.includes(s.id)); d.samples = d.samples.filter(s => !ids.includes(s.id)); if (s0) touch(d, s0.project_id); save(); },

    async listLogs(pid) { return clone(db().logs.filter(l => l.project_id === pid).sort((a, b) => b.at.localeCompare(a.at))); },
    async addLog(pid, who, text) { const d = db(); addLog(d, pid, who, text); save(false); },

    async uploadAttachment(file, folder, i) {
      if (file.size > 1.5 * 1048576) throw new Error(`시험 모드에서는 1.5MB 이하 파일만 첨부할 수 있습니다: ${file.name} (실제 모드는 파일당 20MB)`);
      await wait(200);
      return { path: `req/${folder}/${i}.${extOf(file.name)}`, name: file.name, size: file.size, type: file.type || '', data: await blobToDataUrl(file) };
    },
    async attachmentUrl(a) { return a.data || ''; },
    async upload(blob) { const url = await blobToDataUrl(blob); if (url.length > 900000) throw new Error('시험 모드에서는 큰 사진을 저장할 수 없습니다(브라우저 저장 한도). 실제 모드에서는 문제없습니다.'); return { path: null, url }; },
    async fn(name, body) {
      await wait(700);
      if (name === 'photo-search') {
        if (body.action === 'track') return { ok: true };
        const q = body.q || '';
        return { photos: Array.from({ length: 12 }, (_, i) => { const h = (q.length * 37 + i * 29) % 360; const url = placeholder(q.slice(0, 18) || '사진', h, `시험 결과 ${i + 1}`);
          return { id: 'demo' + i + Date.now(), source: i % 2 ? 'Pexels' : 'Unsplash', thumb: url, full: url, credit: '시험용', source_url: '' }; }), notes: ['시험 모드: 실제 검색은 Supabase 연결 후 동작합니다'] };
      }
      if (name === 'extract-call') return { result: demoExtract(body.text || '') };
      throw new Error('unknown function');
    },
    channel(name, onMsg) { const s = { name, fn: onMsg }; subs.add(s); return { send: p => bc && bc.postMessage({ name, payload: p }), close: () => subs.delete(s) }; },
    watchProjects(cb) { const s = { name: '__projects', fn: cb }; subs.add(s); return () => subs.delete(s); },
  };
}
/* 시험 모드용 간단 정리기 (실제 모드에서는 Claude가 정리) */
function demoExtract(text) {
  const items = []; const re = /([가-힣A-Za-z0-9\s]{2,20}?)\s*(\d+)\s*컷/g; let m;
  while ((m = re.exec(text))) items.push({ name: m[1].trim(), cuts: Number(m[2]), desc: '' });
  const pick = (words) => { const line = text.split(/\n|\.\s/).find(l => words.some(w => l.includes(w))); return line ? line.trim() : ''; };
  const r = { usage: pick(['상세', '광고', 'SNS', '인스타', '용도']), brand: '', industry: '', items, schedule: pick(['월', '주', '일정', '날짜']),
    budget: pick(['예산', '만원', '만 원']), tone: pick(['톤', '느낌', '무드', '색']), references: pick(['http', '레퍼런스', '참고']), notes: '',
    checks: ['(시험 모드) 실제 운영에서는 Claude가 통화 내용을 읽고 정리합니다'], next_questions: ['촬영물을 본 고객이 무엇을 하길 원하시나요?'], search_keywords: ['cosmetic product photography'] };
  if (!r.budget) r.checks.push('예산 범위 언급 없음');
  if (!items.length) r.checks.push('아이템별 컷수 확인 필요');
  return r;
}
const DB = DEMO ? makeDemoDB() : makeSupabaseDB();
</script>

function bindTop() { const b = $('#logout'); if (b) b.onclick = async () => { await DB.signOut(); S.me = null; location.hash = '#/studio'; route(); }; }

/* 라이트박스 */
function openLightbox(list, idx) {
  let i = idx;
  const el = document.createElement('div'); el.className = 'lb';
  const draw = () => {
    const it = list[i];
    el.innerHTML = `<button class="x" aria-label="닫기">×</button>
      ${list.length > 1 ? '<button class="nav-l" aria-label="이전">‹</button><button class="nav-r" aria-label="다음">›</button>' : ''}
      <img src="${esc(it.url)}" alt=""><div class="cap">${it.caption || ''}</div>`;
    $('.x', el).onclick = close;
    if (list.length > 1) { $('.nav-l', el).onclick = e => { e.stopPropagation(); i = (i - 1 + list.length) % list.length; draw(); }; $('.nav-r', el).onclick = e => { e.stopPropagation(); i = (i + 1) % list.length; draw(); }; }
  };
  const key = e => { if (e.key === 'Escape') close(); if (e.key === 'ArrowLeft' && list.length > 1) { i = (i - 1 + list.length) % list.length; draw(); } if (e.key === 'ArrowRight' && list.length > 1) { i = (i + 1) % list.length; draw(); } };
  let sx = null;
  el.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
  el.addEventListener('touchend', e => { if (sx == null || list.length < 2) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50) { i = (i + (dx < 0 ? 1 : -1) + list.length) % list.length; draw(); } sx = null; });
  el.addEventListener('click', e => { if (e.target === el) close(); });
  function close() { el.remove(); document.removeEventListener('keydown', key); }
  document.addEventListener('keydown', key);
  draw(); document.body.appendChild(el);
}
function sampleCaption(s) {
  return `<b>${esc(s.label)}</b> ${esc(s.title)}${s.kind === 'ai' ? ' · AI 생성 · 무드 참고용' : ''}${s.credit || s.source ? `<br>${esc(creditText(s))}` : ''}`;
}
function creditText(s) {
  if (s.kind === 'ai') return 'AI 생성 · 무드 참고용';
  if (s.source === 'Unsplash' || s.source === 'Pexels') return `Photo by ${s.credit} on ${s.source}`;
  return [s.credit, s.source].filter(Boolean).join(' · ');
}
function modal(html, wide = false, onClose = null) {
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal ${wide ? 'wide' : ''}">${html}</div>`;
  const key = e => { if (e.key === 'Escape') close(); };
  function close() { if (!bg.isConnected) return; bg.remove(); document.removeEventListener('keydown', key); if (onClose) onClose(); }
  bg.addEventListener('mousedown', e => { if (e.target === bg) close(); });
  document.addEventListener('keydown', key);
  document.body.appendChild(bg);
  return { el: $('.modal', bg), close };
}

/* =====================================================================
   라우터
   ===================================================================== */
async function route() {
  const q = new URLSearchParams(location.search);
  if (q.get('p')) return renderCustomer(q.get('p'));
  if (location.hash.startsWith('#/studio')) return renderStudio();
  closeChannels();
  return renderRequestForm();
}
window.addEventListener('hashchange', route);
</script>
